name: Android UI Preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop/**
      - codex/**
    paths:
      - 'app/src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-ui-preview.yml'

concurrency:
  group: android-ui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare diagnostics directory
        run: |
          mkdir -p build/ui-preview
          date -u > build/ui-preview/workflow-started.txt
          echo "ANDROID_HOME=${ANDROID_HOME}" >> build/ui-preview/workflow-started.txt
          command -v sdkmanager >> build/ui-preview/workflow-started.txt 2>&1 || true
          command -v avdmanager >> build/ui-preview/workflow-started.txt 2>&1 || true
          command -v emulator >> build/ui-preview/workflow-started.txt 2>&1 || true
          command -v adb >> build/ui-preview/workflow-started.txt 2>&1 || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm | tee build/ui-preview/kvm.txt

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Install emulator image
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > build/ui-preview/sdk-licenses.log 2>&1 || true
          sdkmanager "platform-tools" "emulator" "system-images;android-29;default;x86_64" 2>&1 | tee build/ui-preview/sdk-install.log
          avdmanager list device > build/ui-preview/avd-devices.txt 2>&1
          echo no | avdmanager create avd \
            --force \
            --name meao_ui_preview \
            --package "system-images;android-29;default;x86_64" \
            --device "pixel_2" \
            > build/ui-preview/avd-create.log 2>&1

      - name: Start emulator
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          nohup emulator \
            -avd meao_ui_preview \
            -no-window \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -camera-back none \
            -camera-front none \
            -no-snapshot \
            -wipe-data \
            > build/ui-preview/emulator.log 2>&1 &
          echo $! > build/ui-preview/emulator.pid

          timeout 60s adb wait-for-device
          timeout 600s bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size > build/ui-preview/display.txt
          adb shell getprop > build/ui-preview/getprop-booted.txt

      - name: Capture UI screenshots
        shell: bash
        run: |
          set -Eeuo pipefail

          collect_diagnostics() {
            timeout 20s adb logcat -d -t 800 > build/ui-preview/logcat.txt 2>&1 || true
            timeout 20s adb shell dumpsys activity activities > build/ui-preview/activity.txt 2>&1 || true
            timeout 20s adb shell dumpsys window windows > build/ui-preview/windows.txt 2>&1 || true
            timeout 20s adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            timeout 20s adb pull /sdcard/window.xml build/ui-preview/window-final.xml >/dev/null 2>&1 || true
          }
          trap collect_diagnostics EXIT

          capture() {
            local name="$1"
            timeout 20s adb exec-out screencap -p > "build/ui-preview/${name}.png"
          }

          tap_text() {
            local label="$1"
            local region="$2"
            timeout 20s adb shell uiautomator dump /sdcard/window.xml >/dev/null
            timeout 20s adb pull /sdcard/window.xml build/ui-preview/window.xml >/dev/null
            cp build/ui-preview/window.xml "build/ui-preview/window-before-${label}.xml"
            read -r x y < <(python3 - "$label" "$region" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          label, region = sys.argv[1], sys.argv[2]
          root = ET.parse('build/ui-preview/window.xml').getroot()
          matches = []
          for node in root.iter('node'):
              if node.attrib.get('text') != label and node.attrib.get('content-desc') != label:
                  continue
              match = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
              if not match:
                  continue
              left, top, right, bottom = map(int, match.groups())
              matches.append(((left + right) // 2, (top + bottom) // 2))
          if not matches:
              raise SystemExit(f'Unable to find UI node: {label}')
          point = max(matches, key=lambda item: item[1]) if region == 'bottom' else min(matches, key=lambda item: item[1])
          print(*point)
          PY
            )
            echo "$label $x $y" >> build/ui-preview/taps.txt
            timeout 10s adb shell input tap "$x" "$y"
            sleep 2
          }

          timeout 30s adb install -r app/build/outputs/apk/debug/app-debug.apk
          timeout 10s adb shell settings put system font_scale 1.0
          timeout 10s adb shell am force-stop com.kdlay.meaotodo || true
          timeout 30s adb shell am start -W -n com.kdlay.meaotodo/.MainActivity
          sleep 5

          capture 01-today

          tap_text 计划 bottom
          capture 02-plan-tasks

          tap_text 日历 top
          capture 03-plan-calendar

          tap_text 专注 bottom
          capture 04-focus-idle

          tap_text 记录 bottom
          capture 05-record-timeline

          tap_text 账本 top
          capture 06-record-ledger

          tap_text 洞察 top
          capture 07-record-insights

      - name: Stop emulator
        if: always()
        run: adb emu kill || true

      - name: Upload UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ github.sha }}
          path: build/ui-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
