name: Android Compile Check

on:
  pull_request:
    branches:
      - main
      - develop/**
      - codex/**
  push:
    branches:
      - main
      - develop/**
      - codex/**

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test, assemble, and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace
