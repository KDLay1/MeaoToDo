name: Android Compile Check

on:
  pull_request:
    branches:
      - main
      - develop/**
      - codex/**
  push:
    branches:
      - main
      - develop/**
      - codex/**

concurrency:
  group: android-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test, assemble, and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace --console=plain 2>&1 | tee android-ci.log

      - name: Upload Android CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-log-${{ github.sha }}
          path: android-ci.log
          retention-days: 7
