name: Android UI Preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop/**
      - codex/**
    paths:
      - 'app/src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-ui-preview.yml'

concurrency:
  group: android-ui-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Capture UI screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -Eeuo pipefail
            mkdir -p build/ui-preview

            collect_diagnostics() {
              adb logcat -d -t 400 > build/ui-preview/logcat.txt 2>&1 || true
              adb shell dumpsys activity activities > build/ui-preview/activity.txt 2>&1 || true
              adb shell dumpsys window windows > build/ui-preview/windows.txt 2>&1 || true
            }
            trap collect_diagnostics EXIT

            capture() {
              local name="$1"
              adb exec-out screencap -p > "build/ui-preview/${name}.png"
            }

            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kdlay.meaotodo || true
            adb shell am start -W -n com.kdlay.meaotodo/.MainActivity
            sleep 6

            # Main navigation coordinates for a 1080 x 2400 Pixel 6 emulator.
            capture 01-today

            adb shell input tap 405 2280
            sleep 2
            capture 02-plan-tasks

            # Plan secondary navigation: Tasks / Calendar.
            adb shell input tap 810 125
            sleep 2
            capture 03-plan-calendar

            adb shell input tap 675 2280
            sleep 2
            capture 04-focus-idle

            adb shell input tap 945 2280
            sleep 2
            capture 05-record-timeline

            # Record secondary navigation: Timeline / Ledger / Insights.
            adb shell input tap 540 125
            sleep 2
            capture 06-record-ledger

            adb shell input tap 900 125
            sleep 2
            capture 07-record-insights

      - name: Upload UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ github.sha }}
          path: build/ui-preview/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
