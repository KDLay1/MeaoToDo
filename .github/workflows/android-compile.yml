name: Android Compile Check

on:
  pull_request:
    branches:
      - main
      - develop/**
  push:
    branches:
      - develop/**

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Run debug unit tests when present
        run: |
          if [ -d app/src/test ] && find app/src/test -type f \( -name '*Test.kt' -o -name '*Test.java' \) | grep -q .; then
            ./gradlew testDebugUnitTest --stacktrace
          else
            echo "No JVM unit tests found under app/src/test; skipping testDebugUnitTest for this UI-only PR."
          fi
